<title>점곡 보건소</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
/* 배치: 보건소 간판 띠 아래에 근무 단계 막대, 그 아래 한 화면에 한 가지 일. 진료 기록지는 종이 서식처럼 줄 칸으로 만든다.
   감염병마다 고유한 색 하나를 정해 안내판, 상황판 핀, 선생님 화면에 똑같이 쓴다.
   교실 태블릿과 TV에서 똑같이 보이도록 밝은 화면 하나로 고정했다. */
:root {
  color-scheme: light;
  --paper: #eef4f1;
  --card: #ffffff;
  --ink: #17312b;
  --ink-2: #4c645d;
  --line: #cbdad4;
  --clinic: #1f6f5c;
  --clinic-2: #dcefe7;
  --sign: #123f35;
  --alert: #cf4b25; --alert-bg: #fde8df;
  --cue: #f4b400; --cue-bg: #fff4cf;
  --ok: #24724a; --ok-bg: #dcf1e3;
  --d-flu: #2f66c0; --d-pox: #d0542a; --d-food: #6f7d10; --d-eye: #bf3478; --d-mumps: #7650bd; --d-covid: #a87200;
  --dc: var(--clinic);
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Nanum Gothic", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
[data-d="flu"] { --dc: var(--d-flu); } [data-d="pox"] { --dc: var(--d-pox); } [data-d="food"] { --dc: var(--d-food); }
[data-d="eye"] { --dc: var(--d-eye); } [data-d="mumps"] { --dc: var(--d-mumps); } [data-d="covid"] { --dc: var(--d-covid); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--paper); }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 18px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 48px;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sign); }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 400; margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea { font: inherit; color: var(--ink); }
:focus-visible { outline: 3px solid var(--cue); outline-offset: 3px; }
.wrap { max-width: 1060px; margin: 0 auto; }
.bleed {
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 간판 */
.top { background: var(--sign); color: #fff; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top .wrap { display: flex; align-items: center; gap: 14px; padding-block: 12px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo svg { flex: none; }
.logo h1 { font-size: clamp(1.4rem, 4vw, 1.9rem); letter-spacing: 0.02em; }
.logo small { display: block; font-size: 0.8rem; opacity: 0.8; font-family: var(--font-body); letter-spacing: 0.08em; }
.top .sp { flex: 1; }
.staff { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); border-radius: 999px; padding: 4px 14px 4px 4px; font-weight: 700; font-size: 0.95rem; }
.staff b { width: 32px; height: 32px; border-radius: 50%; background: var(--cue); color: var(--sign); display: grid; place-items: center; font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; }
.sync { font-size: 0.82rem; opacity: 0.85; }

/* 단계 막대 */
.steps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin: 16px 0 18px; }
.steps button { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 6px; text-align: center; line-height: 1.3; min-width: 0; }
.steps button i { display: block; font-style: normal; font-size: 0.75rem; color: var(--ink-2); font-weight: 700; }
.steps button b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1rem; }
.steps button.on { border-color: var(--clinic); background: var(--clinic); color: #fff; }
.steps button.on i { color: #d7efe6; }
.steps button.done { border-color: var(--clinic); }
.steps button:disabled { opacity: 0.5; cursor: not-allowed; background: transparent; }
.steps .lockic { display: inline-block; vertical-align: -2px; margin-right: 2px; }
.part-tag { display: flex; gap: 6px; margin-top: 18px; font-size: 0.85rem; font-weight: 800; color: var(--ink-2); }
.part-tag span { flex: 1; text-align: center; border-top: 3px solid var(--line); padding-top: 2px; }
.part-tag span:first-child { flex: 3; border-color: var(--clinic); }
.part-tag span:last-child { flex: 3; border-color: var(--cue); }

/* 공통 판 */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: clamp(16px, 3vw, 28px); display: grid; gap: 18px; }
.panel > h2 { font-size: clamp(1.45rem, 3.4vw, 1.9rem); color: var(--sign); }
.lead { color: var(--ink-2); max-width: 62ch; }
.say { display: flex; gap: 12px; align-items: flex-start; }
.say .who { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--clinic-2); display: grid; place-items: center; overflow: hidden; }
.say .bub { background: var(--clinic-2); border-radius: 4px 16px 16px 16px; padding: 12px 16px; min-width: 0; }
.say .bub b { color: var(--clinic); }
.btn { border: none; background: var(--clinic); color: #fff; border-radius: 12px; padding: 12px 22px; font-weight: 800; font-size: 1.05rem; min-height: 50px; }
.btn:disabled { background: #9fb3ac; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--clinic); border: 2px solid var(--clinic); }
.btn.cue { background: var(--cue); color: var(--sign); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.msg { border-radius: 12px; padding: 10px 14px; font-weight: 700; }
.msg.no { background: var(--alert-bg); color: var(--alert); }
.msg.ok { background: var(--ok-bg); color: var(--ok); }
.msg.info { background: var(--cue-bg); color: #6d5100; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 800; }
.field .hint, .hint { font-size: 0.88rem; color: var(--ink-2); }
.inp, textarea.inp { width: 100%; border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fbfdfc; font-size: 1.05rem; }
textarea.inp { min-height: 92px; resize: vertical; }
.inp:focus { border-color: var(--clinic); outline: none; }
.count { font-size: 0.85rem; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.count.full { color: var(--ok); font-weight: 800; }
.blank-sent { font-size: 1.15rem; line-height: 2.2; }
.blank-sent .inp { display: inline-block; width: 7.5em; padding: 4px 8px; text-align: center; font-weight: 800; }

/* 출근 */
.badges { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.badge-btn { border: 2px solid var(--line); background: #fbfdfc; border-radius: 16px; padding: 16px; display: flex; gap: 14px; align-items: center; text-align: left; }
.badge-btn:hover { border-color: var(--clinic); }
.badge-btn .no { flex: none; width: 54px; height: 54px; border-radius: 14px; background: var(--clinic); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.7rem; }
.badge-btn strong { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; display: block; }
.badge-btn span { font-size: 0.9rem; color: var(--ink-2); }

/* 진료 */
.qdots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-weight: 800; color: var(--ink-2); font-size: 0.95rem; }
.qdots i { width: 28px; height: 8px; border-radius: 4px; background: var(--line); }
.qdots i.ok { background: var(--clinic); }
.qdots i.now { background: var(--cue); }
.clinic-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; }
.patient { text-align: center; display: grid; gap: 8px; justify-items: center; background: var(--clinic-2); border-radius: 16px; padding: 14px 10px; }
.patient svg { width: 150px; height: auto; max-width: 100%; }
.patient strong { font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; }
.patient span { font-size: 0.9rem; color: var(--ink-2); line-height: 1.4; }
.chat { display: grid; gap: 10px; }
.chat .q { justify-self: end; background: var(--clinic); color: #fff; border-radius: 16px 4px 16px 16px; padding: 8px 14px; font-weight: 700; max-width: 85%; }
.chat .a { justify-self: start; background: #f4f6f5; border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 10px 14px; max-width: 92%; }
.chat .a.mark { background: var(--cue-bg); border-color: var(--cue); box-shadow: 0 0 0 3px var(--cue-bg); }
.asks { display: flex; gap: 8px; flex-wrap: wrap; }
.asks button { border: 2px solid var(--clinic); background: #fff; color: var(--clinic); border-radius: 999px; padding: 8px 16px; font-weight: 800; }
.testslip { border: 2px dashed var(--ink-2); border-radius: 10px; padding: 10px 14px; background: #fff; font-weight: 800; display: flex; gap: 10px; align-items: center; }
.testslip small { display: block; font-weight: 400; color: var(--ink-2); font-size: 0.82rem; }

.chart { border: 2px solid var(--sign); border-radius: 6px; background: #fffef8; }
.chart .head { background: var(--sign); color: #fff; padding: 8px 14px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--font-display); font-size: 1.15rem; }
.chart .head small { font-family: var(--font-body); font-size: 0.85rem; opacity: 0.85; }
.chart .line { display: grid; grid-template-columns: 130px minmax(0, 1fr); border-top: 1px solid #d9d4c0; }
.chart .line:first-of-type { border-top: none; }
.chart .line > b { background: #f5f1e2; padding: 12px; border-right: 1px solid #d9d4c0; font-size: 0.98rem; }
.chart .line > div { padding: 10px 12px; min-width: 0; display: grid; gap: 8px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 0.98rem; }
.chip.on { border-color: var(--clinic); background: var(--clinic); color: #fff; }
.picked { font-weight: 800; color: var(--dc); }

.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.dcard { border: 2px solid var(--line); border-top: 8px solid var(--dc); background: #fff; border-radius: 12px; padding: 10px 12px; text-align: left; display: grid; gap: 6px; align-content: start; }
.dcard h4 { font-size: 1.25rem; color: var(--dc); }
.dcard ul { display: grid; gap: 2px; font-size: 0.9rem; line-height: 1.45; }
.dcard li::before { content: "· "; color: var(--dc); font-weight: 800; }
.dcard li.hit { background: var(--cue-bg); font-weight: 800; border-radius: 4px; }
.dcard.on { border-color: var(--dc); box-shadow: 0 0 0 3px var(--dc); }
button.dcard:hover { border-color: var(--dc); }

.linked { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 800; }
.linked span { background: var(--clinic-2); border-radius: 10px; padding: 6px 12px; }
.linked span.d { background: var(--dc); color: #fff; }
.linked svg { flex: none; }

/* 상황판 지도 */
.mapbox { overflow-x: auto; border-radius: 14px; border: 1px solid var(--line); background: #e4efe7; }
.mapbox svg { display: block; width: 100%; min-width: 620px; height: auto; }
.legend { display: flex; gap: 8px 14px; flex-wrap: wrap; font-size: 0.9rem; font-weight: 700; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; background: var(--dc); }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stats div { background: var(--clinic-2); border-radius: 12px; padding: 8px 14px; font-weight: 700; }
.stats b { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; color: var(--clinic); font-variant-numeric: tabular-nums; margin-right: 2px; }
.wait { border: 3px dashed var(--cue); background: var(--cue-bg); border-radius: 16px; padding: 18px; display: grid; gap: 10px; justify-items: start; }
.wait h3 { font-size: 1.35rem; color: #6d5100; }

/* 안내문 */
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.poster { border: 3px solid var(--dc); border-radius: 14px; overflow: hidden; background: #fff; }
.poster .ph { background: var(--dc); color: #fff; padding: 12px 16px; }
.poster .ph small { font-weight: 800; letter-spacing: 0.08em; font-size: 0.8rem; opacity: 0.9; }
.poster .ph h3 { font-size: 1.6rem; }
.poster .pb { padding: 14px 16px; display: grid; gap: 10px; }
.poster .pb h4 { font-size: 1.05rem; color: var(--dc); }
.poster .pb ul { display: grid; gap: 2px; }
.poster .pb li::before { content: "· "; font-weight: 800; color: var(--dc); }
.poster .pb .src { font-size: 0.85rem; color: var(--ink-2); border-top: 1px dashed var(--line); padding-top: 8px; }
.poster .empty { color: #9aaba5; }
.taken { font-size: 0.82rem; font-weight: 800; color: var(--ink-2); }
button.dcard:disabled { opacity: 0.45; cursor: not-allowed; }
.refbox { border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #f7faf9; display: grid; gap: 6px; font-size: 0.95rem; }
.extlink { color: var(--clinic); font-weight: 800; word-break: break-all; }

/* 퍼짐 실험실 */
.presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.preset { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 12px; text-align: left; display: grid; gap: 2px; }
.preset strong { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; }
.preset span { font-size: 0.88rem; color: var(--ink-2); }
.preset.on { border-color: var(--clinic); box-shadow: 0 0 0 3px var(--clinic-2); }
.preset em { font-style: normal; font-size: 0.8rem; font-weight: 800; color: var(--ok); }
.lab { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; align-items: start; }
.cvwrap { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid var(--sign); background: #f6faf8; }
.cvwrap canvas { display: block; width: 100%; height: auto; }
.cvwrap .tag { position: absolute; left: 10px; top: 8px; background: rgba(18,63,53,0.85); color: #fff; border-radius: 8px; padding: 2px 10px; font-weight: 800; font-size: 0.9rem; }
.timebar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.timebar i { display: block; height: 100%; width: 0; background: var(--clinic); }
.meter { display: grid; gap: 10px; }
.meter .big { display: flex; gap: 10px; }
.meter .big div { flex: 1; border-radius: 12px; padding: 8px 12px; background: var(--clinic-2); }
.meter .big div.sick { background: var(--alert-bg); }
.meter .big b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.meter .big div.sick b { color: var(--alert); }
.meter .big span { font-size: 0.85rem; font-weight: 800; }
.events { display: grid; gap: 6px; }
.events li { border-radius: 10px; padding: 6px 10px; font-size: 0.92rem; font-weight: 700; background: #f2f4f3; color: #9aaba5; display: flex; gap: 8px; align-items: center; }
.events li i { font-style: normal; font-size: 0.75rem; border: 1px solid currentColor; border-radius: 6px; padding: 0 5px; flex: none; }
.events li.on { background: var(--alert-bg); color: var(--alert); }
.runs { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.runs th, .runs td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
.runs th { font-size: 0.88rem; color: var(--ink-2); }
.tbl-scroll { overflow-x: auto; }
.radios { display: grid; gap: 8px; }
.radios button { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 14px; text-align: left; font-weight: 700; }
.radios button.on { border-color: var(--clinic); background: var(--clinic-2); }

/* 회의 */
.cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.cat { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 10px; font-weight: 800; text-align: center; line-height: 1.35; }
.cat.on { border-color: var(--alert); background: var(--alert-bg); color: var(--alert); }
.opin { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; background: #fbfdfc; }
.opin h4 { font-size: 1.1rem; }
.meetboard { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.meetboard section { background: #f7faf9; border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.meetboard h4 { font-size: 1rem; color: var(--alert); }
.note { background: #fff; border: 1px solid var(--line); border-left: 6px solid var(--cue); border-radius: 8px; padding: 8px 10px; font-size: 0.95rem; line-height: 1.5; }
.note small { display: block; font-weight: 800; color: var(--ink-2); font-size: 0.78rem; }
.endcard { display: grid; gap: 12px; }
.endcard ul { display: grid; gap: 6px; }
.endcard li { display: flex; gap: 8px; align-items: baseline; }
.endcard li b { flex: none; width: 7.5em; color: var(--ink-2); font-size: 0.92rem; }

/* 선생님 화면 */
.tpanel { display: grid; gap: 18px; }
.tbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.tbar h2 { font-size: 1.5rem; color: var(--sign); margin-right: auto; }
.switch { border: 2px solid var(--cue); background: var(--cue-bg); color: #6d5100; border-radius: 12px; padding: 10px 16px; font-weight: 800; }
.switch.open { background: var(--cue); color: var(--sign); }
.danger { border: 2px solid var(--alert); background: #fff; color: var(--alert); border-radius: 12px; padding: 8px 14px; font-weight: 800; }
.danger.arm { background: var(--alert); color: #fff; }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.slot { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; }
.slot .sn { display: flex; gap: 10px; align-items: center; }
.slot .sn b { width: 36px; height: 36px; border-radius: 50%; background: var(--clinic); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; }
.slot .sn strong { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; }
.slot .st { font-weight: 800; color: var(--clinic); }
.slot .st.off { color: #9aaba5; }
.prog { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.prog i { height: 8px; border-radius: 4px; background: var(--line); }
.prog i.ok { background: var(--clinic); }
.tsec { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: clamp(14px, 2.5vw, 22px); display: grid; gap: 12px; }
.tsec > h3 { font-size: 1.35rem; color: var(--sign); }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pair > div { min-width: 0; display: grid; gap: 8px; align-content: start; }
.pair h4 { font-size: 1.05rem; color: var(--ink-2); }
.think { display: grid; gap: 8px; counter-reset: t; }
.think li { counter-increment: t; display: flex; gap: 10px; align-items: baseline; font-size: 1.05rem; }
.think li::before { content: counter(t); flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--sign); color: #fff; display: inline-grid; place-items: center; font-family: var(--font-display); font-size: 0.95rem; }
.foot { margin-top: 22px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: space-between; font-size: 0.88rem; color: var(--ink-2); }
.foot a, .foot button { color: var(--ink-2); background: none; border: none; text-decoration: underline; padding: 0; font-size: 0.88rem; }
.foot button.arm { color: var(--alert); font-weight: 800; }

@media (max-width: 820px) {
  .clinic-grid, .split, .lab { grid-template-columns: minmax(0, 1fr); }
  .patient { grid-template-columns: 110px minmax(0, 1fr); text-align: left; justify-items: start; align-items: center; }
  .patient svg { width: 100px; grid-row: span 2; }

    btn.disabled = true;
    const tick = () => {
      const left = Math.ceil((lockUntil[key] - Date.now()) / 1000);
      if (left <= 0 || !document.body.contains(btn)) { btn.disabled = false; btn.textContent = label; return; }
      btn.textContent = left + '초 뒤에 다시 확인';
      setTimeout(tick, 250);
    };
    tick();
  }
  return c;
}

async function apiGet(params) {
  const q = new URLSearchParams(params).toString();
  const r = await fetch(API_URL + '?' + q, { method: 'GET', redirect: 'follow', cache: 'no-store' });
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
async function apiPost(body) {
  const opts = { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) };
  try {
    const r = await fetch(API_URL, opts);
    return await r.json();
  } catch (e) {
    await fetch(API_URL, Object.assign({}, opts, { mode: 'no-cors' }));
    const st = await apiGet({ action: 'state' });
    const slot = st.slots && st.slots[body.n - 1];
    if (slot && slot.device === body.device) return { ok: true };
    throw e;
  }
}

function viewClinicKeep() { const y = window.scrollY; viewClinic(); window.scrollTo(0, y); }
function checkChart(btn, i, P, st) {
  const m = $('#cMsg');
  $('#view').querySelectorAll('.a.mark').forEach(x => x.classList.remove('mark'));
  const place = norm(st.place);
  if (!place || !P.keys.some(k => place.includes(k))) {
    const c = fail('place' + S.n + i, btn, m, '① 다녀온 곳을 다시 봅시다. 주민이 「어디에 다녀왔나요?」에 한 대답에서 장소 이름을 찾아 써 봅시다.');
    if (c >= 2) { const a = $('#ans0'); if (a) a.classList.add('mark'); }
    return;
  }
  const want = P.sy.slice().sort().join(), got = st.sy.slice().sort().join();
  if (want !== got) {
    const extra = st.sy.filter(k => !P.sy.includes(k)).length, miss = P.sy.filter(k => !st.sy.includes(k)).length;
    const why = extra && miss ? '주민이 말하지 않은 증상이 들어 있고, 말한 증상 가운데 빠진 것도 있어요.' : (extra ? '주민이 말하지 않은 증상이 들어 있어요.' : '주민이 말한 증상 가운데 빠진 것이 있어요.');
    const c = fail('sym' + S.n + i, btn, m, '② 증상을 다시 봅시다. ' + why);
    if (c >= 2) { const a = $('#ans1'); if (a) a.classList.add('mark'); }
    return;
  }
  if (st.d !== P.d) {
    let t = st.d ? '③ 고른 카드에 주민의 증상이 모두 들어 있는지 견주어 봅시다.' : '③ 안내판에서 카드를 하나 골라 봅시다.';
    if (st.d && P.test) t += ' 주민이 가져온 검사 결과지도 다시 읽어 봅시다.';
    const c = fail('dis' + S.n + i, btn, m, t);
    if (c >= 2) $('#board').querySelectorAll('li').forEach(li => li.classList.toggle('hit', P.sy.includes(li.dataset.k)));
    return;
  }
  st.ok = true; save(); push();
  viewClinicKeep();
}

const CW = 1200, CH = 680, RAD = 11, TOUCH = 40, DUR = 15;
function setupSim(p) {
  if (sim && sim.raf) cancelAnimationFrame(sim.raf);
  const dots = [];
  for (let i = 0; i < p.n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 95 + Math.random() * 55;
    dots.push({ x: i === 0 ? CW / 2 : 30 + Math.random() * (CW - 60), y: i === 0 ? CH / 2 : 30 + Math.random() * (CH - 60), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, sick: i === 0, at: i === 0 ? -1 : 0 });
  }
  sim = { p, dots, t: 0, running: false, raf: 0 };
  meter();
}
function meter() {
  const s = sim.dots.filter(d => d.sick).length;
  $('#mSick').textContent = s; $('#mHealthy').textContent = sim.dots.length - s;
  $('#events').querySelectorAll('li').forEach(li => li.classList.toggle('on', s >= Number(li.dataset.at)));
  $('#tbar').style.width = Math.min(100, sim.t / DUR * 100) + '%';
}
function drawIdle() {
  const c = $('#cv').getContext('2d');
  c.fillStyle = '#f6faf8'; c.fillRect(0, 0, CW, CH);
  c.fillStyle = '#9aaba5'; c.font = '700 40px "Nanum Gothic", sans-serif'; c.textAlign = 'center';
  c.fillText('위에서 장소를 골라 봅시다', CW / 2, CH / 2);
}
function drawSim() {
  const c = $('#cv').getContext('2d');
  c.fillStyle = '#f6faf8'; c.fillRect(0, 0, CW, CH);
  c.strokeStyle = '#e3ece8'; c.lineWidth = 2;
  for (let x = 100; x < CW; x += 100) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, CH); c.stroke(); }
  for (let y = 100; y < CH; y += 100) { c.beginPath(); c.moveTo(0, y); c.lineTo(CW, y); c.stroke(); }
  sim.dots.forEach(d => {
    if (d.sick) { c.fillStyle = 'rgba(207,75,37,0.13)'; c.beginPath(); c.arc(d.x, d.y, TOUCH, 0, Math.PI * 2); c.fill(); }
  });
  sim.dots.forEach(d => {
    c.beginPath(); c.arc(d.x, d.y, RAD, 0, Math.PI * 2);
    c.fillStyle = d.sick ? '#cf4b25' : '#3f9a78'; c.fill();
    c.lineWidth = 3; c.strokeStyle = '#ffffff'; c.stroke();
  });
}
function startSim(p) {
  setupSim(p); sim.running = true;
  $('#runBtn').disabled = true; $('#runHint').textContent = '실험하는 중이에요. 빨간 점이 어떻게 늘어나는지 지켜봅시다.';
  document.querySelectorAll('.preset').forEach(b => b.disabled = true);
  let prev = performance.now();
  const step = now => {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    sim.t += dt;
    const D = sim.dots;
    D.forEach(d => {
      d.x += d.vx * dt; d.y += d.vy * dt;
      if (d.x < RAD) { d.x = RAD; d.vx = Math.abs(d.vx); } if (d.x > CW - RAD) { d.x = CW - RAD; d.vx = -Math.abs(d.vx); }
      if (d.y < RAD) { d.y = RAD; d.vy = Math.abs(d.vy); } if (d.y > CH - RAD) { d.y = CH - RAD; d.vy = -Math.abs(d.vy); }
      if (Math.random() < dt * 0.6) { const a = Math.atan2(d.vy, d.vx) + (Math.random() - 0.5) * 1.4, sp = Math.hypot(d.vx, d.vy); d.vx = Math.cos(a) * sp; d.vy = Math.sin(a) * sp; }
    });
    const pInf = 1 - Math.exp(-4 * dt);
    D.forEach(s => {
      if (!s.sick || sim.t - s.at < 0.3) return;
      D.forEach(o => {
        if (o.sick) return;
        if (Math.hypot(o.x - s.x, o.y - s.y) < TOUCH && Math.random() < pInf) { o.sick = true; o.at = sim.t; }
      });
    });
    drawSim(); meter();
    if (sim.t < DUR) { sim.raf = requestAnimationFrame(step); return; }
    sim.running = false;
    const sick = D.filter(d => d.sick).length;
    S.sim.runs.push({ id: p.id, n: p.n, sick }); save(); push();
    const y = window.scrollY; viewLab(); window.scrollTo(0, y);
    setupSim(p); sim.dots = D; sim.t = DUR; drawSim(); meter();
    $('#cvTag').textContent = p.t + ' · 끝: 아픈 사람 ' + sick + '명';
    document.querySelectorAll('.preset').forEach(b => b.classList.toggle('on', b.dataset.id === p.id));
    $('#runHint').textContent = `실험 끝! ${p.t}에서 아픈 사람이 1명에서 ${sick}명이 되었어요. 다시 하려면 장소를 눌러요.`;
  };
  sim.raf = requestAnimationFrame(step);
}

  if (d.sent1) return [part2 ? '1부 끝, 2부 하는 중' : '1부 끝, 2부 기다리는 중', false];
  if (c >= 6) return ['진료 마침, 상황판 정리 중', false];
  return [`진료 ${c} / 6명`, false];
}
function renderTeacher() {
  const T = $('#teacher');
  const ss = teacherSlots();
  const cases = [];
  ss.forEach(sl => sl.data && (sl.data.cases || []).forEach(c => cases.push({ p: c.p, d: c.d, who: sl.n })));
  const pair = fn => `<div class="pair">${ss.map(sl => `<div><h4>직원 ${sl.n}</h4>${fn(sl.data, sl.n) || '<p class="hint">아직 없어요</p>'}</div>`).join('')}</div>`;
  const notes = [];
  ss.forEach(sl => sl.data && sl.data.meet && (sl.data.meet.ops || []).forEach(o => notes.push({ cat: o.cat, text: o.text, who: sl.n })));
  T.innerHTML = `<div class="tpanel">
    <div class="tbar"><h2>선생님 화면 · 근무 상황</h2>
      <button type="button" class="switch ${part2 ? 'open' : ''}" id="p2">${part2 ? '2부 열림 (누르면 닫기)' : '2부 「유행 경보」 열기'}</button>
      <button type="button" class="danger" id="resetAll">전체 비우기</button>
      <a href="#" id="toStudent" class="btn ghost" style="text-decoration:none;display:inline-grid;place-items:center">학생 화면</a></div>
    <p class="hint" id="tMsg">${API_URL ? '5초마다 새로 불러옵니다.' : '미리보기: 시트에 연결되지 않아 이 기기의 기록만 보입니다.'}</p>
    <div class="slots">${ss.map(sl => { const [t, off] = stageText(sl); const st = sl.data ? sl.data.stage || 1 : 0;
      return `<div class="slot"><div class="sn"><b>${sl.n}</b><strong>직원 ${sl.n}</strong></div><p class="st ${off ? 'off' : ''}">${t}</p>
        <div class="prog">${STEPS.map((_, k) => `<i class="${st > k + 1 || (st === 6 && sl.data && sl.data.meet) ? 'ok' : ''}"></i>`).join('')}</div>
        ${sl.device && API_URL ? `<div class="row"><button type="button" class="danger" data-rel="${sl.n}" style="padding:4px 10px;font-size:0.85rem">배정 풀기</button></div>` : ''}</div>`; }).join('')}</div>
    <section class="tsec"><h3>마을 상황판</h3>${statsHTML(cases)}<div class="mapbox">${mapSVG(cases)}</div>${legend()}</section>
    <section class="tsec"><h3>1부 정리: 알게 된 점과 내 경험</h3>
      ${pair(d => d && (d.learn || d.exp) ? `<p class="note"><small>알게 된 점</small>${esc(d.learn) || '-'}</p><p class="note"><small>내 경험</small>${esc(d.exp) || '-'}</p>` : '')}</section>
    <section class="tsec"><h3>주민 안내문</h3>${pair((d, n) => d && d.notice && !d.notice.draft ? posterHTML(d.notice, n) : (d && d.notice ? `<p class="hint">${DM[d.notice.d].name} 조사 중</p>` : ''))}</section>
    <section class="tsec"><h3>퍼짐 실험 결과</h3>${pair(d => {
      if (!d || !d.sim || !(d.sim.runs || []).length) return '';
      const rows = d.sim.runs.map(r => `<tr><td>${(PRESETS.find(p => p.id === r.id) || {}).t || r.id}</td><td>${r.n}명</td><td>1명 → ${r.sick}명</td></tr>`).join('');
      return `<div class="tbl-scroll"><table class="runs"><thead><tr><th>장소</th><th>사람 수</th><th>아픈 사람</th></tr></thead><tbody>${rows}</tbody></table></div>${d.sim.why ? `<p class="note"><small>왜 그렇게 되었을까</small>${esc(d.sim.why)}</p>` : ''}`;
    })}</section>
    <section class="tsec"><h3>보건소 회의: 감염병의 위험성</h3>
      <div class="meetboard">${CATS.map(c => `<section><h4>${c.t}</h4>${notes.filter(n => n.cat === c.id).map(n => `<p class="note"><small>직원 ${n.who}</small>${esc(n.text)}</p>`).join('') || '<p class="hint">아직 없어요</p>'}</section>`).join('')}</div>
      ${pair(d => d && d.meet && d.meet.life ? `<p class="note"><small>많은 사람이 이용하는 장소의 위험성</small>${esc(d.meet.life)}</p>` : '')}</section>
    <section class="tsec"><h3>함께 생각해 볼 질문</h3><ol class="think">
      <li>상황판에서 환자가 다녀온 곳은 어떤 곳인가요? 공통점이 있나요?</li>
      <li>같은 감염병인데 다녀온 곳이 다른 주민이 있어요. 무엇을 알 수 있나요?</li>
      <li>공원과 영화관 실험에서 아픈 사람 수가 왜 달라졌을까요?</li>
      <li>감염병은 어떤 위험성이 있나요? 내 몸과 다른 사람으로 나누어 말해 봅시다.</li>
      <li>많은 사람이 이용하는 장소에서 감염병 때문에 생길 수 있는 위험성은 무엇일까요?</li>
    </ol></section>
  </div>`;
  $('#toStudent').addEventListener('click', e => { e.preventDefault(); try { history.replaceState(null, '', location.pathname + location.search); } catch (err) { location.hash = ''; } route(); });
  $('#p2').addEventListener('click', async () => {
    const want = !part2;
    if (!API_URL) { part2 = want; try { localStorage.setItem(LOCAL_P2, want ? '1' : '0'); } catch (e) {} renderTeacher(); return; }
    try { const r = await apiGet({ action: 'open', key: TEACHER_KEY, v: want ? 1 : 0 }); if (r.ok) part2 = want; } catch (e) { $('#tMsg').textContent = '연결하지 못했어요. 다시 눌러 보세요.'; }
    renderTeacher();
  });
  $('#resetAll').addEventListener('click', async e => {
    if (!armed('all', e.currentTarget, '전체 비우기')) return;
    if (!API_URL) { S = fresh(); save(); part2 = false; try { localStorage.setItem(LOCAL_P2, '0'); } catch (err) {} renderTeacher(); return; }
    try { await apiGet({ action: 'reset', key: TEACHER_KEY }); } catch (err) {}
    await pull(); renderTeacher();
  });
  T.querySelectorAll('[data-rel]').forEach(b => b.addEventListener('click', async e => {
    if (!armed('rel' + b.dataset.rel, e.currentTarget, '배정 풀기')) return;
    try { await apiGet({ action: 'release', key: TEACHER_KEY, n: b.dataset.rel }); } catch (err) {}
    await pull(); renderTeacher();
  }));
}

/* ───────── 시작 ───────── */
let timer = null;
async function tickStudent() {
  if (document.hidden || location.hash === '#teacher') return;
  if (sim && sim.running) return;
  const before = part2 + '|' + JSON.stringify(slots.map(s => s.data && [s.data.cases && s.data.cases.length, s.data.notice && s.data.notice.d, !!s.data.meet]));
  await pull();
  const after = part2 + '|' + JSON.stringify(slots.map(s => s.data && [s.data.cases && s.data.cases.length, s.data.notice && s.data.notice.d, !!s.data.meet]));
  if (before === after) return;
  renderSteps();
  const active = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (S.view === 3 && S.sent1) { const w = $('#wait'); if (w) { w.outerHTML = sentBox(); bindWait(); } const m = $('#map'); if (m) m.innerHTML = mapSVG(allCases()); }
  else if (S.view === 3 && !active) { const m = $('#map'); if (m) m.innerHTML = mapSVG(allCases()); }
  else if (S.view === 6 && S.meet.ok) { const y = window.scrollY; viewMeet(); window.scrollTo(0, y); }
  else if (S.view === 4 && !active) { const y = window.scrollY; viewNotice(); window.scrollTo(0, y); }
}
async function route() {
  clearInterval(timer);
  if (location.hash === '#teacher') {
    await pull(); render();
    timer = setInterval(async () => { if (!document.hidden) { await pull(); renderTeacher(); } }, 5000);
  } else {
    render();
    await pull(); render();
    timer = setInterval(tickStudent, 6000);
  }
}
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (!document.hidden && location.hash !== '#teacher') tickStudent(); });
setSync(API_URL ? '' : '미리보기: 이 기기에만 저장');
route();
</script>
